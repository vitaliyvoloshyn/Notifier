services:
    web:
        build: .
        container_name: notifier_web
        restart: unless-stopped
        command: sh -c "python manage.py migrate --noinput && gunicorn notifier.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60 --access-logfile - --error-logfile -"
        ports:
            - "8000:8000"
        env_file:
            - .env
        volumes:
            - ./db.sqlite3:/app/db.sqlite3

    bot:
        build: .
        container_name: notifier_bot
        restart: unless-stopped
        command: python manage.py run_bot
        env_file:
            - .env
        volumes:
            - ./db.sqlite3:/app/db.sqlite3
        depends_on:
            - web

    scheduler:
        build: .
        container_name: notifier_scheduler
        restart: unless-stopped
        command: python manage.py run_scheduler
        env_file:
            - .env
        volumes:
            - ./db.sqlite3:/app/db.sqlite3
        depends_on:
            - web
